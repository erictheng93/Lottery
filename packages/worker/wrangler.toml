name = "lottery-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"

# Cron disabled: source rate-limits Cloudflare IPs; data is loaded via manual
# backfill (wrangler dev --remote → /api/trigger-backfill). Re-add to resume polling.
# [triggers]
# crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lottery-db"
database_id = "9dfeb4d4-ebe7-40bd-b564-35a8e9cc1d1d"

[[kv_namespaces]]
binding = "CSRF_CACHE"
id = "83e21c7ce1a749c6ad188916fa3cf2aa"

[vars]
SOURCE_BASE_URL = "https://open-lat.inja777.com"
ENVIRONMENT = "production"
