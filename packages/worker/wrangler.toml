name = "lottery-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"

[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"

# Cron disabled: the source's Cloudflare bot management blocks the Worker's egress IP.
# Scraping now runs from GitHub Actions (non-CF IP) → POST /api/ingest. See .github/workflows/scrape.yml.
# The scheduled() handler stays in code as a fallback if the source ever stops challenging Workers.
# [triggers]
# crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lottery-db"
database_id = "9dfeb4d4-ebe7-40bd-b564-35a8e9cc1d1d"

[[kv_namespaces]]
binding = "CSRF_CACHE"
id = "83e21c7ce1a749c6ad188916fa3cf2aa"

[vars]
SOURCE_BASE_URL = "https://open-lat.inja777.com"
ENVIRONMENT = "production"
